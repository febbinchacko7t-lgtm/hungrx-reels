name: Post daily reel
on:
  schedule:
    - cron: '8 22 * * *'   # 3:38 AM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (create container, do not publish)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: post-reel
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post one reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BATCH: mcd_2026_11
          START: '2026-11-20'
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python3 tools/post_cloud.py
      - name: Save log
        if: success()
        run: |
          if [ -n "$(git status --porcelain posted_log.csv)" ]; then
            git config user.name "hungrx-bot"; git config user.email "actions@users.noreply.github.com"
            git add posted_log.csv; git commit -m "Log posted reel"; git push
          fi
